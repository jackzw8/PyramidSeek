<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PyramidSeek 跑批控制台</title>
<style>
  :root{--bg:#f6f6f4;--card:#fff;--line:#e4e3df;--tx:#2c2c2a;--sub:#6b6a66;--acc:#1a5fb4;--ok:#1e8e5a;--bad:#c0392b}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx)}
  main{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:20px;font-weight:500;margin:0 0 4px}
  .sub{color:var(--sub);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .card h2{font-size:14px;font-weight:500;margin:0 0 10px;color:var(--sub)}
  .row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}
  .field{display:flex;flex-direction:column;gap:4px;min-width:150px}
  label{font-size:12px;color:var(--sub)}
  select,input[type=text],input[type=number]{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
  input[type=text]{min-width:280px}
  button{padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;cursor:pointer}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
  button.danger{background:#fff;border-color:var(--bad);color:var(--bad)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .bar{height:10px;background:#ecebe7;border-radius:6px;overflow:hidden;margin:8px 0}
  .bar>i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
  .kv{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
  .kv b{font-weight:500}
  .phase{padding:1px 8px;border-radius:10px;background:#eef2f7;font-size:12px}
  .phase.done{background:#e5f2ea;color:var(--ok)} .phase.failed{background:#faecea;color:var(--bad)}
  pre#log{height:280px;overflow:auto;background:#14161a;color:#c9d4de;font:12px/1.55 ui-monospace,Consolas,monospace;padding:12px;border-radius:8px;white-space:pre-wrap}
  pre#log .ln-err{color:#ff9a9a}
  pre#log .ln-warn{color:#e3c07a}
  pre#log .ln-sum{color:#7ec8e3}
  .pick{display:flex;gap:6px}
  .pick input{flex:1}
  .mini{padding:5px 10px;font-size:12px;white-space:nowrap}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:9}
  .modal[hidden]{display:none}
  .modal-box{background:#fff;border-radius:10px;width:min(600px,92vw);max-height:82vh;display:flex;flex-direction:column;padding:14px}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .modal-path{font:12px ui-monospace,Consolas,monospace;color:var(--sub);margin-bottom:8px;word-break:break-all}
  .modal-list{overflow:auto;flex:1;border:1px solid var(--line);border-radius:8px;padding:4px;min-height:180px}
  .modal-list div{padding:6px 8px;cursor:pointer;border-radius:6px;font-size:13px}
  .modal-list div:hover{background:#eef2f7}
  .modal-foot{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .modal-foot .hint{font-size:12px;color:var(--sub)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--sub);font-weight:400}
  .st-done{color:var(--ok)} .st-failed{color:var(--bad)} .st-running{color:var(--acc)}
  .pending-list{max-height:160px;overflow:auto;font-size:13px}
  .msg{font-size:13px;color:var(--sub);min-height:20px;margin-top:6px}
  .err{color:var(--bad)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:800px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>PyramidSeek 跑批控制台</h1>
  <div class="sub">M5-4 / M5-5 · 子进程跑批（关掉浏览器不中断）· 任务互斥 · 数据源平权可选（ADR-015）</div>

  <div class="card">
    <h2>1. 配置并触发跑批</h2>
    <div class="row">
      <div class="field"><label>模式</label>
        <select id="mode">
          <option value="daily">daily（快照+重算）</option>
          <option value="financials">financials（三表全量）</option>
          <option value="cold">cold（冷启动全量）</option>
          <option value="retry">retry（补失败清单）</option>
        </select></div>
      <div class="field"><label>市场</label>
        <select id="markets">
          <option value="A HK">A 股 + 港股</option>
          <option value="A">仅 A 股</option>
          <option value="HK">仅港股</option>
        </select></div>
      <div class="field"><label>A 股财报源</label><select id="sourceA"></select></div>
      <div class="field"><label>港股财报源</label><select id="sourceHk"></select></div>
      <div class="field"><label>limit（每市场最多 N 只）</label><input type="number" id="limit" min="1" placeholder="不限"></div>
    </div>
    <div class="row">
      <div class="field" style="flex:1"><label>股票池：自定义 codes（逗号 / 空格分隔，如 SH600519, HK00700；留空 = 全市场）</label>
        <input type="text" id="codes" placeholder="SH600519, HK00700"></div>
      <div class="field" style="flex:1"><label>或：选样清单文件（--codes-file）</label>
        <div class="pick"><input type="text" id="codesFile" placeholder="可多份，逗号分隔：a.txt, b.txt">
          <button type="button" class="mini" id="btnPickFile">浏览…</button></div></div>
    </div>
    <div class="row">
      <div class="field"><label>清单类型</label>
        <select id="selKind">
          <option value="industry">A 股行业选样</option>
          <option value="hk_ggt">港股通成分股</option>
        </select></div>
      <div class="field" id="levelField"><label>行业层级</label>
        <select id="selLevel">
          <option value="l2">申万二级（约 130 行业）</option>
          <option value="l1">申万一级（约 31 行业）</option>
        </select></div>
      <div class="field" id="perField"><label>每行业取前 N</label>
        <input type="number" id="selPer" value="10" min="1" max="100"></div>
      <div class="field" style="flex:1"><label>保存到目录</label>
        <div class="pick"><input type="text" id="selDir" value="assets/data/lists">
          <button type="button" class="mini" id="btnPickDir">浏览…</button></div></div>
      <button id="btnSelect">生成清单</button>
    </div>
    <div class="msg" id="selMsg"></div>
    <div class="row">
      <button class="primary" id="btnRun">启动跑批</button>
      <button class="danger" id="btnStop" disabled>停止</button>
      <label style="align-self:center"><input type="checkbox" id="offline"> offline（只 fixtures，回归）</label>
      <label style="align-self:center" title="只替换本轮市场的产物，其他市场沿用上一批（D-61）"><input type="checkbox" id="merge"> 合并保留其他市场</label>
    </div>
    <div class="msg" id="runMsg"></div>
  </div>

  <div class="card">
    <h2>2. 进度与日志</h2>
    <div class="kv">
      <span>阶段 <span class="phase" id="phase">idle</span></span>
      <span>进度 <b id="progText">—</b></span>
      <span>错误 <b id="errCount">0</b></span>
      <span>run <b id="runId">—</b></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <pre id="log">（等待输出…）</pre>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>3. 失败清单（<span id="pendingCount">0</span>）</h2>
      <div class="pending-list" id="pendingList">（加载中…）</div>
      <div class="row" style="margin-top:8px">
        <button id="btnRetry">一键 retry（--mode retry）</button>
      </div>
    </div>
    <div class="card">
      <h2>4. 发布到 Pages</h2>
      <div class="kv" style="margin-bottom:8px"><span>产物目录 <b id="pubDir">—</b></span></div>
      <div class="row">
        <button id="btnGate">先跑门禁（--check）</button>
        <button class="primary" id="btnPublish">发布（--push，门禁+dist+gh-pages）</button>
      </div>
      <pre id="pubLog" style="height:150px;overflow:auto;background:#14161a;color:#c9d4de;font:12px/1.5 ui-monospace,Consolas,monospace;padding:10px;border-radius:8px;white-space:pre-wrap">（发布输出…）</pre>
    </div>
  </div>

  <div class="card">
    <h2>5. 历史任务</h2>
    <table><thead><tr><th>run_id</th><th>模式</th><th>市场</th><th>源</th><th>状态</th><th>结束时间</th></tr></thead>
    <tbody id="history"></tbody></table>
  </div>
  <div class="modal" id="picker" hidden>
    <div class="modal-box">
      <div class="modal-head"><b id="pkTitle">选择</b>
        <button type="button" class="mini" id="pkClose">关闭</button></div>
      <div class="modal-path" id="pkPath">/</div>
      <div class="modal-list" id="pkList"></div>
      <div class="modal-foot">
        <span class="hint">只列仓库内的目录；文件只列 .txt（点文件即选中）</span>
        <button type="button" id="pkOk">选定当前目录</button>
      </div>
    </div>
  </div>
  <div class="modal" id="pubConfirm" hidden>
    <div class="modal-box" style="width:min(540px,92vw)">
      <div class="modal-head"><b>确认发布到 Pages</b></div>
      <div class="modal-list" id="pubInfo" style="cursor:default"></div>
      <div class="modal-foot">
        <span class="hint">发布后线上约 1 分钟生效</span>
        <span>
          <button type="button" class="mini" id="pubCancel">取消</button>
          <button type="button" class="primary" id="pubOk">确认发布</button>
        </span>
      </div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let sources = {};
let runCooldownUntil = 0; // 提交后的冷却截止时间（见 render 与 btnRun）

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, body };
}

let sourcesSig = '';

/** ISO(UTC) → 本地时间 `YYYY-MM-DD HH:mm:ss`
 * sqlite 里存的是 UTC（`datetime_utc()`），直接显示会比本地时间少 8 小时；
 * 历史表的「结束时间」曾经就是原始 ISO，看着像时间不对。
 */
function fmtLocal(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} `
    + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function fillSources(payload) {
  sources = payload.sources || {};
  // 轮询每 2.5s 调一次；源列表没变就**绝不碰 DOM** ——
  // 否则重建 <select> 会把用户手选的源打回“默认”
  const sig = JSON.stringify(sources);
  if (sig === sourcesSig) return;
  sourcesSig = sig;

  for (const [sel, market] of [['sourceA','A'], ['sourceHk','HK']]) {
    const el = $(sel);
    const keep = el.value; // 记住用户当前的选择（首次为空）
    el.innerHTML = '';
    (sources[market] || []).forEach((s) => {
      const opt = document.createElement('option');
      opt.value = s.name;
      opt.textContent = s.label + (s.default ? '（默认）' : '');
      el.appendChild(opt);
    });
    const fallback = (sources[market] || []).find((s) => s.default);
    if (keep) el.value = keep; // 重建后恢复；不在新列表里则下面回落默认
    if (!el.value && fallback) el.value = fallback.name;
  }
}

function render(st) {
  const running = st.running;
  // 跑批本身只要 1~2 秒，光靠 running 状态挡不住连点（每次点的时候上一次已结束），
  // 再加 3 秒冷却，避免误触产生一串重复记录
  $('btnRun').disabled = running || Date.now() < runCooldownUntil;
  $('btnStop').disabled = !running;
  $('phase').textContent = st.phase || 'idle';
  $('phase').className = 'phase ' + (st.phase || '');
  $('errCount').textContent = st.errors || 0;
  $('runId').textContent = st.runId || '—';
  const p = st.progress || {};
  if (p.total) {
    $('progText').textContent = `${p.done}/${p.total}（${Math.round(p.done / p.total * 100)}%）`;
    $('bar').style.width = (p.done / p.total * 100) + '%';
  } else { $('progText').textContent = running ? '采集中…' : '—'; }
}

async function refresh() {
  try {
    const { body } = await api('/api/state');
    fillSources(body);
    render(body.status || {});
    $('pendingCount').textContent = body.pendingCount ?? 0;
    $('pubDir').textContent = body.publicDataDir || '—';
    const tbody = $('history'); tbody.innerHTML = '';
    (body.history || []).forEach((r) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.run_id}</td><td>${r.mode}</td><td>${r.markets}</td>`
        + `<td>${r.source_a || '—'} / ${r.source_hk || '—'}</td>`
        + `<td class="st-${r.status}">${r.status}</td><td>${fmtLocal(r.finished_at)}</td>`;
      tbody.appendChild(tr);
    });
    if (!running) loadPending();
  } catch (e) { /* 控制台重启中 */ }
}

async function loadPending() {
  const { body } = await api('/api/pending');
  const el = $('pendingList');
  const items = body.items || [];
  el.innerHTML = items.length
    ? items.map((x) => `<div>${x.code || JSON.stringify(x).slice(0, 60)}</div>`).join('')
    : '（无失败项）';
}

const LN_ERR = /\bERROR\b|Traceback|Exception\b/;
const LN_WARN = /(^|\s)(WARNING|note)[:\s]|降级到|全链路失败|自检：/;

let logSig = '';

async function tailLog() {
  const { body } = await api('/api/log?tail=200');
  const lines = body.lines || [];
  const el = $('log');
  if (!lines.length) {
    el.textContent = '（等待输出…）';
    return;
  }
  const sig = lines.join('\n');
  if (sig === logSig) return; // 内容没变就别重绘：否则会把正在往上翻的滚动位置拽回底部
  logSig = sig;
  // 只有原本就贴着底部时才自动跟随（用户往上翻看历史时不打扰）
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;

  // 逐行着色：真错误才红，说明性提示（note / 降级 / 自检）黄，避免把预期提示看成报错
  el.innerHTML = '';
  lines.forEach((line) => {
    const div = document.createElement('div');
    div.textContent = line;
    if (LN_ERR.test(line)) div.className = 'ln-err';
    else if (LN_WARN.test(line)) div.className = 'ln-warn';
    else if (line.startsWith('[batch] 产物校验') || line.startsWith('[batch] 完成'))
      div.className = 'ln-sum';
    el.appendChild(div);
  });
  if (atBottom) el.scrollTop = el.scrollHeight;
}

let pkMode = 'dir';
let pkPath = '';

function pickerOpen(mode) {
  pkMode = mode;
  const seed = mode === 'file'
    ? ($('codesFile').value || 'data/lists')
    : ($('selDir').value || 'data/lists');
  pkPath = mode === 'file' && /\.[a-z0-9]+$/i.test(seed)
    ? seed.replace(/[\\/][^\\/]*$/, '')
    : seed;
  $('pkTitle').textContent = mode === 'file' ? '选择清单文件（.txt）' : '选择保存目录';
  $('pkOk').style.display = mode === 'dir' ? '' : 'none';
  $('picker').hidden = false;
  loadFs(pkPath);
}

function pickerClose() { $('picker').hidden = true; }

function pickerTake(value) {
  if (pkMode === 'file') {
    // D-63：清单可多份。选一次追加一份（逗号分隔），后端会拆成多个 --codes-file。
    // 不关闭弹窗，方便连续点几个文件；点「关闭」退出。
    const parts = ($('codesFile').value || '').split(',').map((s) => s.trim()).filter(Boolean);
    if (!parts.includes(value)) parts.push(value);
    $('codesFile').value = parts.join(', ');
    $('pkPath').textContent = `已选 ${parts.length} 份清单，可继续选择（点关闭退出）`;
    return;
  }
  $('selDir').value = value;
  pickerClose();
}

async function loadFs(path) {
  const list = $('pkList');
  const { ok, body } = await api('/api/fs?path=' + encodeURIComponent(path || ''));
  if (!ok) { list.textContent = body.error || '读取失败'; return; }
  pkPath = body.cwd;
  $('pkPath').textContent = '/' + (body.cwd || '');
  list.innerHTML = '';
  const join = (name) => (body.cwd ? body.cwd + '/' : '') + name;

  if (body.parent !== null) {
    const up = document.createElement('div');
    up.textContent = '..（上一级）';
    up.onclick = () => loadFs(body.parent);
    list.appendChild(up);
  }
  body.dirs.forEach((name) => {
    const d = document.createElement('div');
    d.textContent = '[目录] ' + name;
    d.onclick = () => loadFs(join(name));
    list.appendChild(d);
  });
  if (pkMode === 'file') {
    body.files.forEach((name) => {
      const f = document.createElement('div');
      f.textContent = '[文件] ' + name;
      f.onclick = () => pickerTake(join(name));
      list.appendChild(f);
    });
  }
  if (!body.dirs.length && !(pkMode === 'file' && body.files.length)) {
    const empty = document.createElement('div');
    empty.textContent = '（没有子目录' + (pkMode === 'file' ? ' / .txt 文件' : '') + '）';
    empty.style.cursor = 'default';
    list.appendChild(empty);
  }
}

$('btnPickFile').onclick = () => pickerOpen('file');
$('btnPickDir').onclick = () => pickerOpen('dir');
$('pkClose').onclick = pickerClose;
$('pkOk').onclick = () => pickerTake(pkPath);
$('picker').onclick = (e) => { if (e.target === $('picker')) pickerClose(); };

$('selKind').onchange = () => {
  const industry = $('selKind').value === 'industry';
  $('levelField').style.display = industry ? '' : 'none';
  $('perField').style.display = industry ? '' : 'none';
};

$('btnSelect').onclick = async () => {
  const kind = $('selKind').value;
  const msg = $('selMsg');
  msg.className = 'msg';
  msg.textContent = kind === 'hk_ggt'
    ? '拉取港股通成分股…（约 13 秒）'
    : '选样中…（行业映射首次约 1 分钟，之后秒回）';
  $('btnSelect').disabled = true;
  try {
    const { ok, body } = await api('/api/select', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        kind,
        level: $('selLevel').value,
        perIndustry: +$('selPer').value || 10,
        outDir: $('selDir').value.trim(),
      }),
    });
    if (!ok) {
      msg.textContent = body.error || '生成失败';
      msg.className = 'msg err';
      return;
    }
    $('codesFile').value = body.path;
    const detail = body.groups && body.groups.length ? ` / ${body.groups.length} 个行业` : '';
    msg.textContent = `已生成 ${body.count} 只${detail} → ${body.path}`
      + '（已填进上面的清单框，直接点「启动跑批」）';
  } catch (e) {
    msg.textContent = '请求失败：' + e;
    msg.className = 'msg err';
  } finally {
    $('btnSelect').disabled = false;
  }
};

$('btnRun').onclick = async () => {
  if (Date.now() < runCooldownUntil) {
    $('runMsg').textContent = '刚提交过，等 3 秒再点（跑批只要几秒，别重复启动）';
    $('runMsg').className = 'msg err';
    return;
  }
  runCooldownUntil = Date.now() + 3000;
  $('btnRun').disabled = true;
  const codes = $('codes').value.split(/[,\s，]+/).filter(Boolean);
  const payload = {
    mode: $('mode').value,
    markets: $('markets').value.split(/\s+/),
    sourceA: $('sourceA').value,
    sourceHk: $('sourceHk').value,
    limit: $('limit').value ? +$('limit').value : null,
    codes: codes.length ? codes : null,
    codesFile: $('codesFile').value.trim() || null,
    offline: $('offline').checked,
    merge: $('merge').checked,
  };
  $('runMsg').textContent = '提交中…'; $('runMsg').className = 'msg';
  const { ok, status, body } = await api('/api/run', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload),
  });
  if (ok) { $('runMsg').textContent = `已启动：run_id=${body.status.runId}（关掉浏览器不影响）`; }
  else { $('runMsg').textContent = `被拒绝：${body.error}`; $('runMsg').className = 'msg err'; }
  refresh();
};

$('btnStop').onclick = async () => { await api('/api/stop', {method:'POST'}); refresh(); };
$('btnRetry').onclick = async () => {
  $('mode').value = 'retry'; $('codes').value = ''; $('codesFile').value = '';
  $('btnRun').click();
};
$('btnGate').onclick = async () => {
  $('pubLog').textContent = '门禁执行中（pytest 约需 1 分钟）…';
  const res = await fetch('/api/publish-gate', {method:'POST'});
  const body = await res.json();
  $('pubLog').textContent = (body.output || []).join('\n') || (body.ok ? '门禁通过' : '门禁失败');
};
async function doPublish() {
  $('pubLog').textContent = '发布中（门禁 + 构建 + 推送，约 2 分钟）…';
  const { ok, body } = await api('/api/publish', {method:'POST'});
  $('pubLog').textContent = (body.output || []).join('\n') || (body.error || '');
  if (ok) $('pubLog').textContent += '\n✅ 发布完成，稍后刷新 https://jackzw8.github.io/PyramidSeek/';
}

// 发布前先看「将要发的是什么」：只校验产物合规、不校验内容的话，很容易把
// 别的东西（比如 e2e 测试跑出来的 fixtures）推上线。
$('btnPublish').onclick = async () => {
  const { ok, body } = await api('/api/product');
  if (!ok) {
    $('pubLog').textContent = body.error || '读取产物摘要失败';
    return;
  }
  const info = $('pubInfo');
  info.innerHTML = '';
  const byMarket = Object.entries(body.byMarket || {})
    .map(([m, v]) => `${m}=${(v || {}).stocks ?? 0} 只`).join(' / ') || '—';
  const lines = [
    `产物生成于：${fmtLocal(body.generatedAt)}`,
    `股票总数：${body.codeCount} 只（${byMarket}）`,
    `榜单行数：A=${body.rows.A ?? 0} / HK=${body.rows.HK ?? 0}`,
    `前几只：${body.codes.join('、') || '—'}`,
  ];
  lines.forEach((text) => {
    const div = document.createElement('div');
    div.textContent = text;
    div.style.cursor = 'default';
    info.appendChild(div);
  });
  $('pubConfirm').hidden = false;
};

$('pubCancel').onclick = () => { $('pubConfirm').hidden = true; };
$('pubOk').onclick = () => {
  $('pubConfirm').hidden = true;
  doPublish();
};

refresh(); loadPending(); tailLog();
setInterval(() => { refresh(); tailLog(); }, 2500);
</script>
