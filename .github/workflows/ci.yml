name: CI

# M0-4：CI 空跑 —— lint + pytest + 离线跑批产物校验（不依赖外部数据源）
# 触发：PR / 手动（workflow_dispatch）。
# 2026-11-04 摘掉 push(branches: main)：本项目一律在 main 上提交、不开代码分支（R21），
# push 触发等于「每次提交都跑一遍 + 每推一封失败邮件」；它只是「测试备份」（ADR-014），
# 不参与发布链路，本地门禁 `publish --check` 比它更严格。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest)
        run: |
          set -o pipefail
          pytest -q --tb=line 2>&1 | tee pytest.log

      # 公开仓库的 Actions 原始日志需 admin 权限才能下载；
      # 把 pytest 输出摘录顶成 annotation（网页与 check-runs API 都能匿名读）
      - name: Pytest failures -> annotations
        if: failure()
        run: |
          python - <<'PY'
          import pathlib, sys
          p = pathlib.Path("pytest.log")
          if not p.exists():
              print("::error::pytest.log 未生成（上一步没产出日志）")
              sys.exit(0)
          raw = p.read_text(encoding="utf-8", errors="replace").splitlines()
          print(f"::error::pytest.log {len(raw)} 行 / {p.stat().st_size} 字节")
          msg = " ⏎ ".join(raw[:15] + ["......"] + raw[-45:])
          msg = msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error::" + msg[:8000])
          PY

      # M3-5：离线跑批产出全部产物并校验（schema + 引用完整性），坏产物直接拦下
      - name: Batch + validate (offline)
        run: python -m src.batch --offline
