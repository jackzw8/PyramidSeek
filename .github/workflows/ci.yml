name: CI

# M0-4：CI 空跑 —— PR 触发 lint + pytest（离线，不依赖外部数据源）
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Test (pytest)
        run: |
          set -o pipefail
          pytest -q --tb=line 2>&1 | tee pytest.log

      # 公开仓库的 Actions 原始日志需 admin 权限才能下载；
      # 把失败用例顶成 annotation（网页与 check-runs API 都能匿名读）
      - name: Pytest failures -> annotations
        if: failure()
        run: |
          if [ -f pytest.log ]; then
            grep -aE "^(FAILED|ERROR) " pytest.log | head -30 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "===== pytest.log tail ====="
            tail -30 pytest.log
          fi

      # M3-5：离线跑批产出全部产物并校验（schema + 引用完整性），坏产物直接拦下
      - name: Batch + validate (offline)
        run: python -m src.batch --offline
