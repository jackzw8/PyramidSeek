[project]
name = "pyramidseek"
version = "0.1.0"
description = "金字塔选股 PyramidSeek —— 离线批处理算分 + 静态 JSON 产物 + 静态站点"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# -rs：skip 原因必须可见（不要用 -q 吞掉 skip，否则「全绿」可能是假的）
addopts = "-q -rs"
